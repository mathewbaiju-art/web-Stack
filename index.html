<!DOCTYPE html>
<html lang="en" ng-app="ANGULAR">
<head>
    <meta charset="UTF-8">
    <title>Footballers AngularJS</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #1d2671, #c33764);
        color: #fff;
        padding: 30px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        color: #ffeb3b;
    }

    .container {
        background: #ffffff;
        color: #333;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        max-width: 900px;
        margin: auto;
    }

    input {
        padding: 10px;
        width: 60%;
        border-radius: 6px;
        border: 2px solid #3f51b5;
        margin-bottom: 10px;
        outline: none;
    }

    input:focus {
        border-color: #e91e63;
    }

    button {
        padding: 10px 16px;
        background: linear-gradient(135deg, #ff9800, #ff5722);
        border: none;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        margin-left: 10px;
        font-weight: bold;
    }

    button:hover {
        background: linear-gradient(135deg, #ff5722, #e91e63);
        transform: scale(1.05);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th {
        background: #3f51b5;
        color: white;
        padding: 12px;
        text-transform: uppercase;
    }

    td {
        padding: 10px;
        text-align: center;
    }

    tr:nth-child(even) {
        background: #f5f5f5;
    }

    tr:nth-child(odd) {
        background: #e3f2fd;
    }

    tr:hover {
        background: #ffecb3;
        cursor: pointer;
    }

    .info {
        margin-top: 10px;
        font-weight: bold;
        color: #4caf50;
    }

    .hover-text {
        margin-top: 15px;
        font-style: italic;
        color: #e91e63;
    }
</style>

</head>

<body ng-controller="footballCtrl">

<div class="container">

    <h2>⚽ Footballers List</h2>

    <input type="text"
           ng-model="searchText"
           ng-focus="focusMsg='🔵 Input Focused'"
           ng-blur="focusMsg='⚪ Input Lost Focus'"
           placeholder="Search by name">

    <button ng-click="showMessage()">Show Total Players</button>

    <p class="info">{{focusMsg}}</p>
    <p class="info">{{message}}</p>

    <table>
        <tr>
            <th>Name</th>
            <th>Country</th>
            <th>Club</th>
            <th>Goals</th>
            <th>Position</th>
        </tr>

        <tr ng-repeat="player in footballers | filter:searchText | orderBy:'goals'"
            ng-mouseenter="hover=player.name"
            ng-mouseleave="hover=''">

            <td>{{player.name | uppercase}}</td>
            <td>{{player.country | lowercase}}</td>
            <td>{{player.club}}</td>
            <td>{{player.goals | number}}</td>
            <td>{{player.position}}</td>
        </tr>
    </table>

<p class="hover-text" ng-if="hover">🖱️ Mouse over: {{hover}}</p>
</div>

<script>
    var app = angular.module("ANGULAR", []);

    app.controller("footballCtrl", function ($scope, $http) {

        $scope.focusMsg = "";

        $http.get("footballers.json")
            .then(function (response) {
                $scope.footballers = response.data;
            });

        $scope.showMessage = function () {
            $scope.message = "Total Footballers: " + $scope.footballers.length;
        };
    });
</script>

</body>
</html>
