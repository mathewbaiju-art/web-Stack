<html>
<head>
    <title>Football World - Stadium Locations</title>

    <!-- BOOTSTRAP FIX -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #ffeb3b;
      margin-bottom: 20px;
    }

    button {
      background-color: #ffeb3b;
      border: none;
      color: #333;
      padding: 10px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background-color: white;
      transform: scale(1.1);
    }

    .navbar {
        background-color: #004d00;
    }

    .navbar a {
        color: white !important;
        font-weight: bold;
    }

    .navbar a:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>🏟️ Football World - Stadium Locations</h1>
  <p>Click below to load famous stadium information using AJAX.</p>

  <button onclick="loadStadium()">Load Stadium Info</button>

  <div id="stadiumInfo"></div>

  <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="sports1.html">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

  <script>
    function loadStadium() 
{
      let x = new XMLHttpRequest();

      x.open("GET", "stadium.json", true);

      x.onreadystatechange = function() {
        if (x.readyState === 4 && x.status === 200) {
          let data = JSON.parse(x.responseText);
          document.getElementById("stadiumInfo").innerHTML = `
            <h2>${stadium.name}</h2>
            <p><strong>Location:</strong> ${stadium.city}, ${data.country}</p>
            <p><strong>Capacity:</strong> ${stadium.capacity.toLocaleString()} people</p>
            <p><strong>Opened:</strong> ${stadium.opened}</p>
          `;
        }
      };

      x.send();
    }
  </script>
</body>
</html>
